spring.application.name=auth-system-backend

spring.datasource.url=jdbc:postgresql://localhost:15432/auth_system


spring.datasource.username=auth_user
spring.datasource.password=auth_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Gmail SMTP 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# AfroMessage SMS
afromessage.base-url=https://api.afromessage.com/api
afromessage.token=${AFROMESSAGE_TOKEN}
afromessage.identifier-id=${AFROMESSAGE_IDENTIFIER_ID}
afromessage.sender-name=AfroMessage


# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET} 
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub